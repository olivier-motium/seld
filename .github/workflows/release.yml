name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CODEX_CLI_VERSION: 0.144.4

jobs:
  quality:
    name: Quality and source package gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra release --extra browser-test
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest --cov=continuity_kernel --cov-report=term-missing
      - run: uv run python scripts/verify_bridge_browser.py
      - run: uv run python scripts/privacy_check.py --self-test
      - run: uv run python scripts/privacy_check.py .
      - run: uv build

  build-native:
    name: ${{ matrix.asset }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: gsv-macos-arm64
          - runner: macos-15-intel
            asset: gsv-macos-x86_64
          - runner: ubuntu-22.04
            asset: gsv-linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: gsv-linux-arm64
          - runner: windows-2025
            asset: gsv-windows-x86_64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra release
      - run: npm install --global "@openai/codex@$CODEX_CLI_VERSION"
        shell: bash
      - run: uv run python scripts/build_standalone.py --output dist --asset-name "${{ matrix.asset }}"
      - run: uv run python scripts/write_checksum.py "dist/${{ matrix.asset }}"
      - run: uv run python scripts/privacy_check.py . --artifact "dist/${{ matrix.asset }}" --artifact "dist/${{ matrix.asset }}.sha256"
      - run: uv run python scripts/e2e_clean_install.py --binary "dist/${{ matrix.asset }}" --report "dist/${{ matrix.asset }}.e2e.json"
      - run: uv run python scripts/privacy_check.py . --artifact "dist/${{ matrix.asset }}" --artifact "dist/${{ matrix.asset }}.sha256" --artifact "dist/${{ matrix.asset }}.e2e.json"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
            dist/${{ matrix.asset }}.e2e.json
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: release
          merge-multiple: true
      - name: Add installer scripts
        run: cp scripts/install.sh scripts/install.ps1 scripts/uninstall.sh scripts/uninstall.ps1 release/
      - name: Create immutable tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" release/*
          --verify-tag
          --generate-notes
          --title "GSV ${GITHUB_REF_NAME}"

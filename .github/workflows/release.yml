name: Native release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CODEX_CLI_VERSION: 0.144.4

jobs:
  quality:
    name: Quality and source package gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra release --extra browser-test
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests scripts
      - run: uv run pytest --cov=continuity_kernel --cov-report=term-missing
      - name: Require production OAuth client registrations
        run: >-
          uv run python -c
          "from continuity_kernel.connector_client_registration import require_public_client_registrations;
          require_public_client_registrations()"
      - run: uv run python scripts/verify_bridge_browser.py
      - run: uv run python scripts/privacy_check.py --self-test
      - run: uv run python scripts/privacy_check.py .
      - run: uv build
      - name: Require OAuth registrations from the built wheel
        run: >-
          uv run --isolated --no-project --with ./dist/gsv-*.whl python -c
          "from continuity_kernel.connector_client_registration import require_public_client_registrations;
          require_public_client_registrations()"

  build-native:
    name: ${{ matrix.asset }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            asset: gsv-macos-arm64
          - runner: macos-15-intel
            asset: gsv-macos-x86_64
          - runner: windows-2025
            asset: gsv-windows-x86_64.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra release
      - run: npm install --global "@openai/codex@$CODEX_CLI_VERSION"
        shell: bash
      - if: runner.os == 'Windows'
        run: uv run pytest tests/test_release_scripts.py -k "powershell_installer_download or powershell_distinguishes_post_commit_repair_from_rollback" --no-cov
      - run: uv run python scripts/build_standalone.py --output dist --asset-name "${{ matrix.asset }}"
      - run: uv run python scripts/write_checksum.py "dist/${{ matrix.asset }}"
      - run: uv run python scripts/privacy_check.py . --artifact "dist/${{ matrix.asset }}" --artifact "dist/${{ matrix.asset }}.sha256"
      - run: uv run python scripts/e2e_clean_install.py --binary "dist/${{ matrix.asset }}" --require-oauth-ready --report "dist/${{ matrix.asset }}.e2e.json"
      - run: uv run python scripts/privacy_check.py . --artifact "dist/${{ matrix.asset }}" --artifact "dist/${{ matrix.asset }}.sha256" --artifact "dist/${{ matrix.asset }}.e2e.json"
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}
            dist/${{ matrix.asset }}.sha256
            dist/${{ matrix.asset }}.e2e.json
          if-no-files-found: error

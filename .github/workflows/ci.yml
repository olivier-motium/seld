name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
# Each push to main gets its own group (its run id), so no main run waits
# for another or is cancelled, and every merge keeps a complete result.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
      - id: sync
        run: uv sync --frozen --extra dev
      # Each check runs even when an earlier one fails, so one run reports all of them.
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff check .
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run ruff format --check .
      # pyproject.toml pins mypy's python_version to 3.11, so the interpreter version
      # does not change the result. --platform gives the same result as running mypy
      # on that operating system.
      - name: mypy for Linux
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy --platform linux src tests scripts
      - name: mypy for macOS
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy --platform darwin src tests scripts
      - name: mypy for Windows
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run mypy --platform win32 src tests scripts

  test:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
      - id: sync
        run: uv sync --frozen --extra dev --python "${{ matrix.python }}"
      # -n auto starts one pytest-xdist worker per runner CPU. Tests marked serial
      # assert wall-clock bounds of 1 s or less, so they run after, without workers.
      # Both steps append to one coverage data file; the 80% gate (pyproject.toml)
      # is checked once, on the combined data.
      - name: Parallel tests
        if: runner.os != 'Windows'
        run: uv run pytest -n auto -m "not serial" --cov=continuity_kernel --cov-report= --cov-fail-under=0
      - name: Serial tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && runner.os != 'Windows' }}
        run: uv run pytest -m serial --cov=continuity_kernel --cov-append --cov-report= --cov-fail-under=0
      - name: Coverage gate
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && runner.os != 'Windows' }}
        run: uv run coverage report
      - name: Parallel tests
        if: runner.os == 'Windows'
        run: uv run pytest -n auto -m "not serial" --no-cov --tb=line
      - name: Serial tests
        if: ${{ !cancelled() && steps.sync.outcome == 'success' && runner.os == 'Windows' }}
        run: uv run pytest -m serial --no-cov --tb=line
      # The privacy checks also run after a test failure. They scan the tree the tests left.
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/privacy_check.py --self-test
      - if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run python scripts/privacy_check.py .

  package:
    name: Python distributions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv build
      - run: uv run python scripts/privacy_check.py . --artifact dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  browser:
    name: Chromium Bridge acceptance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev --extra browser-test
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/verify_bridge_browser.py
      - run: uv run pytest tests/test_bridge_control_browser.py
